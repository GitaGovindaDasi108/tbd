# Transcendental Book Sales — the server on Cloudflare (Phase 2).
# Free plan: Workers + a SQLite-backed Durable Object. See server/README.md.
name = "tbs-server"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[vars]
# The time zone dates are written in (Apps Script used the script's own).
TIME_ZONE = "UTC"

[[durable_objects.bindings]]
name = "TBS"
class_name = "TbsServer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TbsServer"]
